name: Deploy

on:
  push:
    branches:
      - main
      - next
      - alpha
      - beta

jobs:
  main:
    name: Run checks and deploy
    runs-on: [ubuntu-latest]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: Typeform/.github/shared-actions/setup-node-with-cache@v1
        with:
          use-asdf: true
          package-manager: 'pnpm'
          GH_TOKEN: ${{ secrets.JENKINS_PAT_TOKEN }}

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run linting
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Reset npm registry for publishing
        run: |
          npm config set @typeform:registry https://registry.npmjs.org/
          npm config delete '//npm.pkg.github.com/:_authToken'

      - name: Release
        run: pnpm exec semantic-release
        env:
          GH_TOKEN: ${{ secrets.JENKINS_PAT_TOKEN }}
          # OIDC publishing (with provenance) is enabled via id-token: write permission
          # No NPM_TOKEN needed — @semantic-release/npm v13 uses OIDC automatically
