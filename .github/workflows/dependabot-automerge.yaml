name: Auto-approve and auto-merge dependency PRs

on:
  schedule:
    - cron: "0 8 * * 1,3"   # Every Monday and Wednesday at 10:00 CEST
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    runs-on: [ci-universal-scale-set]

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.AUTOMERGE_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_DEPENDENCIES_APP_PRIVATE_KEY }}

      - name: Auto-merge eligible dependency PRs
        # TEMP (PLT-4308 testing): branch ref so we pick up Go action changes
        # during the pilot. Mutable refs are a supply-chain risk with this App
        # token; pin a full commit SHA once the action is in production.
        # Acceptable risk for this testing phase only.
        uses: Typeform/.github-private/actions/dependabot-automerge@feat/dependabot-automerge-go
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          freeze-windows: ${{ vars.AUTOMERGE_FREEZE_WINDOWS }}
